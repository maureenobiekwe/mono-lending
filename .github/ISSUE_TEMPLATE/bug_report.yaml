---
name: Bug Report
description: Report a bug encountered while using Mono Lending
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Mono Lending issue tracker! Before creating an issue, please consider the following:

        1. This tracker should only be used to report bugs and request features or enhancements for Mono Lending.
            - For questions or support, please review this repository, open an issue, or check the documentation in the project README.
            - For documentation issues, propose an edit directly in the relevant file or pull request.
        2. When making a bug report, make sure you provide all required information. The easier it is for
           maintainers to reproduce, the faster it will be fixed.
        3. If you think you know the reason for the bug, share it with us. Maybe put in a PR 😉

  - type: textarea
    id: bug-info
    attributes:
      label: Information about bug
      description: Also tell us, what did you expect to happen? If applicable, add screenshots to help explain your problem.
      placeholder: Please provide as much information as possible.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Select the affected module of Mono Lending.
      multiple: true
      options:
        - Loan Management
    validations:
      required: true

  - type: textarea
    id: exact-version
    attributes:
      label: Version
      description: Share the exact version numbers of the platform, dependencies, and Mono Lending you are using.
      placeholder: |
        ERP platform version -
        Dependency version -
        Mono Lending version -
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - docker
        - easy-install
        - manual install
        - cloud-hosted
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / Stack trace / Full Error Message.
      description: Please copy and paste any relevant log output. This will be automatically formatted.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: |
        By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/maureenobiekwe/monolending/blob/develop/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
...
